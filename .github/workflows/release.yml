# One source builds all: web (Netlify) + Android APK + Linux AppImage/deb +
# Windows installer, all from spectrahunt-web/out, attached to a GitHub Release.
# Trigger: tag vX.Y.Z (version truth stays in spectrahunt-web/package.json)
# or manual dispatch. Windows cannot build locally -> CI only.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd spectrahunt-web && npm ci && npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: android SDK packages (preinstalled SDK on runner)
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: cd spectrahunt-web && npm ci && npm run build && npx cap sync android
      - name: release keystore (if secrets present)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > spectrahunt-web/android/app/release.keystore
            echo "DRISHTI_KEYSTORE_FILE=$GITHUB_WORKSPACE/spectrahunt-web/android/app/release.keystore" >> $GITHUB_ENV
            echo "DRISHTI_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "DRISHTI_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "DRISHTI_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi
      - run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          cd spectrahunt-web/android && ./gradlew assembleRelease assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            spectrahunt-web/android/app/build/outputs/apk/release/*.apk
            spectrahunt-web/android/app/build/outputs/apk/debug/*.apk

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cd spectrahunt-web && npm ci && npm run build
      - run: cd desktop/src-tauri && cargo install tauri-cli --locked && npx @tauri-apps/cli build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: cd spectrahunt-web; npm ci; npm run build
      - run: cd desktop/src-tauri; cargo install tauri-cli --locked; npx @tauri-apps/cli build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  publish:
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: find dist -mindepth 2 -type f \( -name "*.apk" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" \) -exec mv -t dist {} +
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
