<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Animated star field with a rotating SPHEREx orbit ring and a slow scan sweep">
  <title>DRISHTI — blink between SPHEREx epochs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#0a1226"/>
      <stop offset="1" stop-color="#061a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <style>
      .tw { animation: twinkle 4s ease-in-out infinite; }
      .orb { transform-origin: 600px 180px; animation: spin 28s linear infinite; }
      .scan { animation: sweep 10s ease-in-out infinite; }
      .drift { animation: drift 18s ease-in-out infinite alternate; }
      @keyframes twinkle { 0%,100% { opacity:.22; } 50% { opacity:1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes sweep { 0% { transform: translateY(-150px); opacity:0; } 45% { opacity:.55; } 100% { transform: translateY(150px); opacity:0; } }
      @keyframes drift { from { transform: translateX(-8px); } to { transform: translateX(8px); } }
      @media (prefers-reduced-motion: reduce) {
        .tw, .orb, .scan, .drift { animation: none; }
        .scan { opacity:.22; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <g class="drift" fill="#dbeafe">
    <circle class="tw" cx="80"  cy="62"  r="1.3" style="animation-delay:0s"/>
    <circle class="tw" cx="148" cy="214" r="1.0" style="animation-delay:.6s"/>
    <circle class="tw" cx="212" cy="96"  r="1.6" style="animation-delay:1.2s"/>
    <circle class="tw" cx="278" cy="286" r="1.1" style="animation-delay:1.8s"/>
    <circle class="tw" cx="341" cy="48"  r="1.2" style="animation-delay:2.4s"/>
    <circle class="tw" cx="418" cy="170" r="1.5" style="animation-delay:.9s"/>
    <circle class="tw" cx="486" cy="312" r="1.0" style="animation-delay:2.1s"/>
    <circle class="tw" cx="552" cy="74"  r="1.2" style="animation-delay:.3s"/>
    <circle class="tw" cx="636" cy="332" r="1.4" style="animation-delay:1.5s"/>
    <circle class="tw" cx="704" cy="56"  r="1.0" style="animation-delay:2.7s"/>
    <circle class="tw" cx="778" cy="246" r="1.6" style="animation-delay:.4s"/>
    <circle class="tw" cx="848" cy="118" r="1.1" style="animation-delay:1.9s"/>
    <circle class="tw" cx="922" cy="300" r="1.3" style="animation-delay:2.5s"/>
    <circle class="tw" cx="988" cy="80"  r="1.5" style="animation-delay:1.0s"/>
    <circle class="tw" cx="1052" cy="228" r="1.0" style="animation-delay:2.2s"/>
    <circle class="tw" cx="1122" cy="132" r="1.4" style="animation-delay:.7s"/>
    <circle class="tw" cx="1160" cy="312" r="1.1" style="animation-delay:1.7s"/>
  </g>

  <g stroke="#1e3a5f" stroke-width="1" fill="none" opacity=".55">
    <path d="M120 300 L212 246 L318 268 L402 210"/>
    <path d="M830 92 L922 138 L988 80 L1080 112"/>
  </g>

  <ellipse cx="600" cy="180" rx="440" ry="150" fill="url(#glow)"/>

  <g class="orb">
    <ellipse cx="600" cy="180" rx="330" ry="96" fill="none" stroke="#22d3ee" stroke-opacity=".38" stroke-width="1.2"/>
    <ellipse cx="600" cy="180" rx="330" ry="96" fill="none" stroke="#22d3ee" stroke-opacity=".07" stroke-width="8"/>
    <circle cx="930" cy="180" r="4.5" fill="#fbbf24"/>
    <circle cx="930" cy="180" r="10" fill="#fbbf24" opacity=".15"/>
  </g>

  <circle cx="600" cy="180" r="16" fill="none" stroke="#7dd3fc" stroke-opacity=".5"/>
  <circle cx="600" cy="180" r="3" fill="#7dd3fc"/>

  <rect class="scan" x="0" y="179" width="1200" height="1.5" fill="#7dd3fc"/>

  <path d="M0 359 H1200" stroke="#164e63" stroke-opacity=".6"/>
</svg>
