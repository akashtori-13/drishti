# SpectraHunt Netlify Configuration
# Frontend: Next.js (static export) served from spectrahunt-web/out
# Backend/Python pipeline runs offline at build time or locally, NOT on Netlify.

[build]
  base = "spectrahunt-web/"
  command = "npm ci && npm run build"
  publish = "spectrahunt-web/out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_DATA_MODE = "static"

# SPA fallback is NOT used (static export has real .html per route).
# Keep clean URLs for hash-based views: nothing to redirect.

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://irsa.ipac.caltech.edu https://vo.imcce.fr https://api.nasa.gov blob:"

# Cache static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JSON data files (in /data/)
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Images
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Block sensitive files
[[redirects]]
  from = "/.git/*"
  to = "/"
  status = 404

[[redirects]]
  from = "/.env*"
  to = "/"
  status = 404
