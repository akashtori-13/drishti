# SpectraHunt Netlify Configuration
# Deploy: https://spectrahunt.netlify.app

[build]
  # Install Python dependencies and build static bundle with real SPHEREx data
  command = """
    pip install -r requirements.txt && \
    python scripts/build_static_bundle.py --region "180,0,5" --max-frames 100
  """
  # Publish the data directory which contains index.html and all JSON files
  publish = "data"

[build.environment]
  PYTHON_VERSION = "3.11"

# MIME types for astronomy data files
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "*.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.db"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"

# SPA routing for hash-based navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security: Block access to sensitive files
[[redirects]]
  from = "/.git/*"
  to = "/"
  status = 404

[[redirects]]
  from = "/.env*"
  to = "/"
  status = 404
